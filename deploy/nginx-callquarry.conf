server {
    listen 4173;
    listen [::]:4173;
    server_name _;

    root /var/www/callquarry;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
